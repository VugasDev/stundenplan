{% extends "base.html" %}
{% block title %}Neues Passwort{% endblock %}
{% block content %}
<h1>Neues Passwort vergeben</h1>
<form method="post" action="{{ url_for('auth.reset_password', user_id=user_id, token=token) }}" class="card">
  {{ form.hidden_tag() }}
  <label>{{ form.password.label }} {{ form.password(placeholder="min. 8 Zeichen") }}</label>
  {% for error in form.password.errors %}<div class="flash flash-error">{{ error }}</div>{% endfor %}
  <label>{{ form.password_repeat.label }} {{ form.password_repeat() }}</label>
  {% for error in form.password_repeat.errors %}<div class="flash flash-error">{{ error }}</div>{% endfor %}
  <button type="submit">Passwort speichern</button>
</form>
{% endblock %}
