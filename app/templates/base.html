<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stundenplan{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="nav">
  <a class="brand" href="/">Stundenplan</a>
  {% if current_user.is_authenticated %}
    <a href="{{ url_for('timetable.index') }}">Plan</a>
    <a href="{{ url_for('classes.list_classes') }}">Klassen</a>
    <form method="post" action="{{ url_for('auth.logout') }}" class="nav-logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Abmelden</button>
    </form>
  {% else %}
    <a href="{{ url_for('auth.login') }}">Anmelden</a>
    <a href="{{ url_for('auth.register') }}">Registrieren</a>
  {% endif %}
</nav>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
