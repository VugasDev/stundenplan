name: Tests

# Laeuft bei jedem Push auf main und bei jedem Pull Request dorthin.
# Zweck: Ein roter Stand soll auffallen, bevor er auf dem Server landet —
# zweimal ist genau das hier schon passiert.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"      # wie auf dem Server
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        # Ohne .env: Die Testkonfiguration bringt eigene Werte mit und darf
        # nicht von der Umgebung abhaengen — das war hier schon einmal ein Fehler.
        run: python -m pytest -q
